name: Scout Agent — Sector RS Report

on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 1-5'   # Mon-Fri 5:30 PM IST — full pipeline
    - cron: '30 11 * * 0'     # Sunday 5:00 PM IST — macro only

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance numpy supabase google-genai

      # ── Step 1: Scout Agent (weekdays only) ───────────────────────────────
      - name: Run Scout Agent
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '00 12'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: python agent.py

      # ── Step 2: Macro Agent (every day including Sunday) ──────────────────
      - name: Run Macro Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: python macro_agent.py

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-outputs
          path: |
            sector_scores.json
            macro_output.json
